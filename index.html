<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toán vui lớp 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--paper:#fffdf6;--grid:#cfe3f5;--ink:#1f3a7a;--text:#22304d;--card:#ffffff;--red:#d93a2f;--green:#1f9d63;--yellow:#ffd23f;
--t1:#ffe9a8;--t2:#ffc9c4;--t3:#c8ecd8;--t4:#cfe0ff;--t5:#e6d4ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--paper:#161c2e;--grid:#232d47;--ink:#a9c0ff;--text:#e8ecf7;--card:#1e2640;--red:#ff7a6e;--green:#3fbf82;
--t1:#4a3f14;--t2:#4d2623;--t3:#1d4331;--t4:#22365f;--t5:#3a2c5c}}
:root[data-theme="dark"]{color-scheme:dark;--paper:#161c2e;--grid:#232d47;--ink:#a9c0ff;--text:#e8ecf7;--card:#1e2640;--red:#ff7a6e;--green:#3fbf82;
--t1:#4a3f14;--t2:#4d2623;--t3:#1d4331;--t4:#22365f;--t5:#3a2c5c}
*{box-sizing:inherit}
body{margin:0;min-height:100vh;font-family:'Baloo 2','Nunito','Segoe UI',system-ui,sans-serif;font-size:18px;color:var(--text);background-color:var(--paper);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
body::before{content:"";position:fixed;top:0;bottom:0;left:clamp(10px,5vw,48px);width:2px;background:var(--red);opacity:.55;pointer-events:none}
main{max-width:640px;margin:0 auto;padding:20px 18px 48px 28px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
h1{margin:0;font-size:clamp(30px,8vw,44px);font-weight:800;color:var(--ink);line-height:1.1;text-decoration:underline wavy var(--red);text-underline-offset:8px;text-decoration-thickness:2px}
.stars{background:var(--yellow);color:#3b2b00;border:3px solid var(--ink);border-radius:999px;padding:2px 14px;font-weight:800;white-space:nowrap}
.lead{margin:18px 0 20px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
button{font:inherit;color:inherit}
button:focus-visible{outline:4px solid var(--red);outline-offset:3px}
.topic{display:flex;gap:14px;align-items:center;text-align:left;background:var(--t);border:3px solid var(--ink);border-radius:18px;padding:14px 16px;box-shadow:5px 5px 0 var(--ink);cursor:pointer;min-height:88px}
.topic:active,.opt:active,.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.ico{flex:none;width:54px;height:54px;display:grid;place-items:center;font-size:32px;font-weight:800;color:var(--ink);background:var(--card);border:3px solid var(--ink);border-radius:50%}
.topic b{display:block;font-size:21px;color:var(--ink);line-height:1.2}
.topic span.d{font-size:16px}
.top{display:flex;align-items:center;gap:12px;margin:14px 0 18px}
.dots{display:flex;gap:6px;flex:1}
.dot{flex:1;height:12px;border-radius:6px;background:var(--card);border:2px solid var(--ink)}
.dot.ok{background:var(--green)}.dot.no{background:var(--red)}.dot.cur{background:var(--yellow)}
.btn{font-size:20px;font-weight:800;padding:8px 22px;min-height:52px;border:3px solid var(--ink);border-radius:999px;background:var(--yellow);color:#3b2b00;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.sm{font-size:16px;min-height:44px;padding:4px 16px}
.q{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:20px 16px;box-shadow:5px 5px 0 var(--ink);text-align:center}
.prompt{margin:0 0 10px;font-size:19px}
.math{font-size:clamp(38px,11vw,60px);font-weight:800;color:var(--ink);line-height:1.2}
.qm{display:inline-block;min-width:1.1em;border-bottom:5px solid var(--red);color:var(--red)}
.vert{display:inline-block;font-variant-numeric:tabular-nums}
.vert .r{display:flex;justify-content:space-between;gap:28px;min-width:3.2em}
.vert .r.l{border-top:5px solid var(--ink);margin-top:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{font-size:32px;font-weight:800;min-height:68px;border:3px solid var(--ink);border-radius:16px;background:var(--card);color:var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.opt.right{background:var(--green);color:#fff}.opt.wrong{background:var(--red);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:16px;min-height:32px;font-size:22px;font-weight:800}
.fb.ok{color:var(--green)}.fb.no{color:var(--red)}
.hint{margin-top:14px;text-align:left;font-size:17px;background:var(--t);border:2px dashed var(--ink);border-radius:12px;padding:8px 12px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.res{text-align:center;padding-top:10px}
.score{display:inline-block;color:var(--red);font-size:clamp(80px,24vw,130px);font-weight:800;line-height:1.15;border:6px solid var(--red);border-radius:50%;padding:0 38px;transform:rotate(-6deg);animation:stamp .5s ease-out}
@keyframes stamp{from{transform:rotate(-6deg) scale(1.8);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
.rem{font-size:24px;font-weight:800;color:var(--red);margin:18px 0 4px}
.big{font-size:34px;letter-spacing:4px}
@media (prefers-reduced-motion:reduce){.score{animation:none}}
</style>
</head>
<body>
<main>
<header><h1>Toán vui lớp 2</h1><div class="stars" id="st" aria-label="Số ngôi sao">⭐ 0</div></header>
<div id="app"></div>
</main>
<script>
const app=document.getElementById('app');
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
let total=0;try{total=+localStorage.getItem('toan2stars')||0}catch(e){}
const saveStars=()=>{try{localStorage.setItem('toan2stars',total)}catch(e){}};
const showStars=()=>{document.getElementById('st').textContent='⭐ '+total};
function ch(a,ex){const c=shuf([...(ex||[]),a+1,a-1,a+2,a-2,a+10,a-10]).filter((x,i,r)=>x>=0&&x!==a&&r.indexOf(x)===i).slice(0,3);return shuf([a,...c])}

const TOP=[
{id:'add',n:'Phép cộng',d:'Cộng trong phạm vi 100',i:'+',h:'Cộng hàng đơn vị trước, rồi cộng hàng chục. Nếu hàng đơn vị được 10 trở lên thì nhớ 1 sang hàng chục.'},
{id:'sub',n:'Phép trừ',d:'Trừ trong phạm vi 100',i:'−',h:'Trừ hàng đơn vị trước, rồi trừ hàng chục. Nếu không trừ được thì mượn 1 chục.'},
{id:'mul',n:'Bảng nhân 2 và 5',d:'Học thuộc lòng cho nhanh',i:'×',h:'Bảng 2: 2, 4, 6, 8, 10, 12... Bảng 5: 5, 10, 15, 20, 25... Các số cách đều nhau.'},
{id:'cmp',n:'So sánh số',d:'Lớn hơn, bé hơn, bằng nhau',i:'<',h:'So hàng chục trước. Hàng chục bằng nhau thì so hàng đơn vị. Dấu luôn mở miệng về phía số lớn hơn.'},
{id:'seq',n:'Dãy số',d:'Tìm số còn thiếu',i:'…',h:'Xem mỗi số hơn số đứng trước bao nhiêu, rồi dùng quy luật đó để tìm số thiếu.'}
];
const G={
add(){const a=R(10,80),b=R(5,Math.min(99-a,70));return{p:'Tính dọc rồi chọn kết quả đúng:',v:[a,'+',b],a:a+b,o:ch(a+b)}},
sub(){const a=R(20,99),b=R(5,a-5);return{p:'Tính dọc rồi chọn kết quả đúng:',v:[a,'−',b],a:a-b,o:ch(a-b)}},
mul(){const n=[2,5][R(0,1)],k=R(1,10),a=n*k;return{p:'Bảng nhân '+n+':',m:n+' × '+k+' = <span class="qm">?</span>',a,o:ch(a,[a+n,a-n,a+n,a-n])}},
cmp(){let a=R(10,99),b=R(10,99);const r=R(0,3);if(r==0)b=a;else if(r==1)b=a-a%10+R(0,9);const s=a>b?'>':a<b?'<':'=';return{p:'Chọn dấu thích hợp:',m:a+' <span class="qm">?</span> '+b,a:s,o:['>','<','='],three:1}},
seq(){const st=[1,2,5,10][R(0,3)],s0=R(1,st>=5?20:30),h=R(1,3);const r=[0,1,2,3,4].map(i=>s0+i*st);const a=r[h];r[h]='?';return{p:'Số nào còn thiếu trong dãy số?',m:r.join(', ').replace('?','<span class="qm">?</span>'),a,o:ch(a)}}
};
let S={};

function home(){
 app.innerHTML='<p class="lead">Chọn một bài để luyện tập. Mỗi bài có 5 câu, làm đúng mỗi câu con được 1 ngôi sao.</p><div class="grid">'+
 TOP.map((t,k)=>'<button class="topic" style="--t:var(--t'+(k+1)+')" data-id="'+t.id+'"><span class="ico">'+t.i+'</span><span><b>'+t.n+'</b><span class="d">'+t.d+'</span></span></button>').join('')+'</div>';
 app.querySelectorAll('.topic').forEach(b=>b.onclick=()=>start(b.dataset.id));
}
function start(id){S={id,i:0,sc:0,res:[],q:G[id](),done:0};quiz()}
function quiz(){
 const t=TOP.find(x=>x.id===S.id),q=S.q;
 const dots=[0,1,2,3,4].map(i=>'<span class="dot '+(i<S.res.length?(S.res[i]?'ok':'no'):i==S.i?'cur':'')+'"></span>').join('');
 const body=q.v?'<div class="math"><div class="vert"><div class="r"><span></span><span>'+q.v[0]+'</span></div><div class="r"><span>'+q.v[1]+'</span><span>'+q.v[2]+'</span></div><div class="r l"><span></span><span class="qm">?</span></div></div></div>':'<div class="math">'+q.m+'</div>';
 app.innerHTML='<div class="top"><button class="btn ghost sm" id="bk">← Trang chủ</button><div class="dots" aria-label="Câu '+(S.i+1)+' trên 5">'+dots+'</div></div>'+
 '<div class="q"><p class="prompt">'+q.p+'</p>'+body+'<div class="opts'+(q.three?' three':'')+'">'+q.o.map(o=>'<button class="opt" data-v="'+o+'">'+o+'</button>').join('')+'</div>'+
 '<div class="fb" id="fb" role="status"></div><div class="row"><button class="btn ghost sm" id="hb">💡 Gợi ý</button><button class="btn" id="nx" hidden></button></div><div id="hx"></div></div>';
 document.getElementById('bk').onclick=home;
 document.getElementById('hb').onclick=()=>{document.getElementById('hx').innerHTML='<div class="hint" style="--t:var(--t1)">'+t.h+'</div>'};
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b));
}
function answer(b){
 if(S.done)return;S.done=1;
 const q=S.q,ok=b.dataset.v===String(q.a),fb=document.getElementById('fb');
 app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.v===String(q.a))x.classList.add('right')});
 if(ok){S.sc++;total++;saveStars();showStars();fb.className='fb ok';fb.textContent=['Giỏi lắm! ⭐','Chính xác! ⭐','Tuyệt vời! ⭐'][R(0,2)]}
 else{b.classList.add('wrong');fb.className='fb no';fb.textContent='Chưa đúng rồi. Đáp án là '+q.a+'.'}
 S.res.push(ok);
 const nx=document.getElementById('nx');nx.hidden=false;nx.textContent=S.i<4?'Câu tiếp theo':'Xem điểm';
 nx.onclick=()=>{if(S.i<4){S.i++;S.q=G[S.id]();S.done=0;quiz()}else result()};
 nx.focus();
}
function result(){
 const p=S.sc*2,m=['Đừng lo, đọc gợi ý rồi thử lại nhé!','Đừng lo, đọc gợi ý rồi thử lại nhé!','Khá lắm! Luyện thêm một lần nữa nhé.','Khá lắm! Luyện thêm một lần nữa nhé.','Giỏi lắm! Chỉ sai 1 câu thôi.','Tuyệt vời! Con làm đúng cả 5 câu.'][S.sc];
 app.innerHTML='<div class="res"><div class="score" aria-label="Điểm '+p+'">'+p+'</div><div class="rem">'+m+'</div><div class="big" aria-hidden="true">'+'⭐'.repeat(S.sc)+'</div>'+
 '<p>Con được '+S.sc+' ngôi sao trong bài này.</p><div class="row"><button class="btn" id="ag">Chơi lại</button><button class="btn ghost" id="hm">Chọn bài khác</button></div></div>';
 document.getElementById('ag').onclick=()=>start(S.id);
 document.getElementById('hm').onclick=home;
}
showStars();home();
</script>
</body>
</html>
